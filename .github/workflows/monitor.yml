name: Monitor Expensify

on:
  schedule:
    - cron: "4,14,24,34,44,54 * * * *"
  workflow_dispatch:
    inputs:
      simular_issue:
        description: "PRUEBA: número de issue de Expensify/App a tratar como recién publicada (vacío = ejecución normal)"
        required: false
        default: ""

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: ${{ inputs.simular_issue != '' && 'prueba' || 'monitor' }}
  cancel-in-progress: false

env:
  TARGET_REPO: Expensify/App
  NOTIFY_USER: LeandroAram
  SHUTDOWN_AT: "2026-11-30T23:59:59-03:00"
  DEVIN_SESSION_URL: https://app.devin.ai/sessions/d297f129bc50410cbf6d6a670ca6707a

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Tests
        run: python -m unittest discover -s tests -t .

      - name: Traer estado (rama estado)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin estado >/dev/null; then
            git fetch --depth=1 origin estado
            git worktree add state FETCH_HEAD
          else
            git worktree add --detach state
            git -C state checkout --orphan estado
            git -C state rm -rfq .
          fi

      - name: Prueba (simulación)
        if: ${{ inputs.simular_issue != '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SIMULATE: ${{ inputs.simular_issue }}
        run: python monitor.py --state state/state.json --simulate "$SIMULATE"

      # El cron de GitHub es poco confiable (a veces pasan horas sin correr), así que cada
      # ejecución revisa cada 10 min durante ~5,5 h y al terminar se vuelve a lanzar sola.
      - name: Monitorear en bucle
        if: ${{ inputs.simular_issue == '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LOOP_MINUTES: "330"
          INTERVAL_SECONDS: "600"
        run: |
          guardar() {
            (cd state && git add -A && { git diff --cached --quiet || {
              git commit -qm "estado $(date -u +%FT%TZ)" && git push -q origin HEAD:refs/heads/estado; }; })
          }
          fin=$(( $(date +%s) + LOOP_MINUTES * 60 ))
          apagado=$(date -d "$SHUTDOWN_AT" +%s)
          fallas=0
          while :; do
            python monitor.py --state state/state.json || fallas=$((fallas + 1))
            guardar || fallas=$((fallas + 1))
            if [ "$(date +%s)" -ge "$apagado" ]; then
              echo "Apagado: no se relanza."
              exit 0
            fi
            [ $(( $(date +%s) + INTERVAL_SECONDS )) -lt "$fin" ] || break
            sleep "$INTERVAL_SECONDS"
          done
          gh workflow run monitor.yml -R "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" \
            || echo "::warning::No se pudo relanzar; queda el cron como respaldo."
          if [ "$fallas" -ne 0 ]; then
            echo "::error::$fallas iteraciones fallaron"
            exit 1
          fi
